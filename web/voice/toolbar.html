<section id="tenk-voice-toolbar" aria-label="Tenk voice chat" hidden>
	<button id="tenk-microphone-toggle" type="button" aria-label="Join voice chat" aria-pressed="false" disabled>
		<span class="tenk-microphone-icon" aria-hidden="true"></span><span id="tenk-microphone-label">Connecting...</span>
	</button>
	<span id="tenk-voice-count" hidden></span>
	<button id="tenk-voice-playback" type="button" hidden>Hear voice</button>
	<button id="tenk-voice-leave" type="button" hidden>Leave</button>
	<span id="tenk-voice-status" role="status" aria-live="polite" hidden></span>
</section>
<div id="tenk-remote-audio" hidden></div>
<script type="module" src="voice/gamer-pub-voice.js"></script>
